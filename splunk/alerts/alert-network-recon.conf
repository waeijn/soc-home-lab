# Alert: Network Reconnaissance Detection
# MITRE ATT&CK: T1046 - Network Service Scanning
# Severity: Medium
# Trigger: More than 3 connections to different ports from single IP (excluding known safe/noisy IPs)

[Network Recon - Port Scan Detected]
search = index=* sourcetype=WinEventLog:Security EventCode=5156 \
  | bucket _time span=60s \
  | stats dc(Destination_Port) as ports_scanned, values(Destination_Port) as ports by _time, Source_Address \
  | where ports_scanned > 3 \
  AND Source_Address != "10.0.2.15" \
  AND Source_Address != "127.0.0.1" \
  AND Source_Address != "192.168.56.101" \
  AND Source_Address != "-" \
  AND NOT match(Source_Address, "^::") \
  AND NOT match(Source_Address, "^fe80")
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
