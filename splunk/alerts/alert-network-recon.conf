# Alert: Network Reconnaissance Detection
# MITRE ATT&CK: T1046 - Network Service Scanning
# Severity: Medium
# Trigger: More than 10 connections to different ports from single IP

[Network Recon - Port Scan Detected]
search = index=* sourcetype=WinEventLog:Security EventCode=5156 \
  | bucket _time span=60s \
  | stats dc(Destination_Port) as ports_scanned by _time, Source_Address \
  | where ports_scanned > 10
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
