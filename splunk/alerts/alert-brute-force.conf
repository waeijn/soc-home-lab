# Alert: RDP Brute Force Detection
# MITRE ATT&CK: T1110 - Brute Force
# Severity: High
# Trigger: More than 5 failed logons from single IP within 60 seconds

[Brute Force - Multiple Failed Logons]
search = index=* sourcetype=WinEventLog:Security EventCode=4625 \
  | bucket _time span=60s \
  | stats count by _time, Source_Network_Address, Account_Name \
  | where count > 5
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email.sendresults = 0
