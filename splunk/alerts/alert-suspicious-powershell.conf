# Alert: Suspicious PowerShell Execution
# MITRE ATT&CK: T1059.001 - PowerShell
# Severity: High
# Trigger: Known malicious keywords in PowerShell script blocks

[Suspicious PowerShell - Malicious Keywords]
search = index=* EventCode=4104 \
  ("DownloadString" OR "IEX" OR "Invoke-Expression" OR \
  "EncodedCommand" OR "WebClient" OR "DownloadFile")
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
